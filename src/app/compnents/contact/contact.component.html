<section id="contact" class="relative min-h-screen flex justify-center items-center px-6 pt-24 pb-10 w-full overflow-hidden bg-slate-950 font-sans">
  
  <!-- 🔹 Animated Glowing Blobs Background -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-cyan-600/20 rounded-full mix-blend-screen filter blur-[120px] animate-blob"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-pink-600/20 rounded-full mix-blend-screen filter blur-[120px] animate-blob animation-delay-2000"></div>

  <!-- 🔹 Glassmorphism Card -->
  <div class="relative z-10 w-full max-w-2xl mx-auto rounded-[2.5rem] bg-white/[0.02] backdrop-blur-2xl border border-white/10 shadow-[0_8px_32px_0_rgba(0,0,0,0.3)] p-8 sm:p-12">
    
    <!-- Header -->
    <div class="text-center mb-10 space-y-4">
      <h2 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white">
        Contact <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400">Me</span>
      </h2>
      <p class="text-slate-400 font-light text-sm sm:text-base">
        Have a question or want to work together? Drop me a message below.
      </p>
    </div>

    <!-- Form -->
        <!-- Form -->
    <form class="space-y-6" (submit)="sendEmail($event)">
      
      <!-- Input Group: Name & Email -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <!-- Name -->
        <div class="space-y-2">
          <label class="text-sm font-medium text-slate-300 ml-1">Name</label>
          <input
            type="text"
            name="user_name"
            required
            placeholder="John Doe"
            class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500 transition-all duration-300"
          />
        </div>

        <!-- Email -->
        <div class="space-y-2">
          <label class="text-sm font-medium text-slate-300 ml-1">Email</label>
          <input
            type="email"
            name="user_email"
            required
            placeholder="john@example.com"
            class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500 transition-all duration-300"
          />
        </div>
      </div>

      <!-- Message -->
      <div class="space-y-2">
        <label class="text-sm font-medium text-slate-300 ml-1">Message</label>
        <textarea
          name="message"
          rows="5"
          required
          placeholder="How can I help you?"
          class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-slate-500 resize-none focus:outline-none focus:ring-2 focus:ring-pink-500/50 focus:border-pink-500 transition-all duration-300"
        ></textarea>
      </div>

      <!-- 🔹 Status Message Display -->
      @if (statusMessage) {
        <div class="text-center p-4 rounded-xl backdrop-blur-md border transition-all duration-300 animate-pulse"
             [ngClass]="{
               'bg-green-500/10 border-green-500/30 text-green-400': statusMessage.includes('successfully'),
               'bg-red-500/10 border-red-500/30 text-red-400': statusMessage.includes('Failed'),
               'bg-blue-500/10 border-blue-500/30 text-blue-400': statusMessage === 'Sending...'
             }">
          {{ statusMessage }}
        </div>
      }

      <!-- Submit Button -->
      <div class="pt-4 flex justify-center">
        <button
          type="submit"
          class="group relative inline-flex items-center justify-center gap-3 px-8 py-4 w-full sm:w-auto bg-white/5 border border-white/10 rounded-full text-white font-medium transition-all duration-300 hover:bg-white/10 hover:scale-105 hover:shadow-[0_0_30px_-5px_rgba(236,72,153,0.4)] overflow-hidden"
        >
          <!-- Hover Gradient -->
          <div class="absolute inset-0 bg-gradient-to-r from-cyan-500/20 via-purple-500/20 to-pink-500/20 opacity-0 group-hover:opacity-100 transition-opacity duration-500 rounded-full"></div>
          
          <span class="relative z-10 flex items-center gap-2">
            Send Message
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform duration-300">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5" />
            </svg>
          </span>
        </button>
      </div>
    </form>

  </div>
</section>
  <app-footer></app-footer>
<!-- Include these animations only once in your global CSS -->
<style>
  /* Blob Animation */
  @keyframes blob {
    0% { transform: translate(0px, 0px) scale(1); }
    33% { transform: translate(30px, -50px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(0.9); }
    100% { transform: translate(0px, 0px) scale(1); }
  }
  .animate-blob {
    animation: blob 7s infinite;
  }
  .animation-delay-2000 {
    animation-delay: 2s;
  }
</style>
