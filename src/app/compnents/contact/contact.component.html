<section class="h-screen p-12 bg-yellow-400 text-center">
  <h2 class="text-3xl font-bold mb-6">Contact Me</h2>
  <form class="max-w-lg mx-auto space-y-4">
    <input type="text" placeholder="Your Name" class="w-full p-3 border rounded-lg">
    <input type="email" placeholder="Your Email" class="w-full p-3 border rounded-lg">
    <textarea rows="4" placeholder="Your Message" class="w-full p-3 border rounded-lg"></textarea>
    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
      Send Message
    </button>
  </form>
</section>
