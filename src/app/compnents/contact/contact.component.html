<section id="contact" class="min-h-screen px-6 py-12 bg-yellow-400 text-center flex flex-col justify-center">
  <h2 class="text-3xl sm:text-4xl font-bold mb-8">Contact Me</h2>

  <form class="w-full max-w-lg mx-auto space-y-4">
    <!-- Name -->
    <input
      type="text"
      placeholder="Your Name"
      class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
    />

    <!-- Email -->
    <input
      type="email"
      placeholder="Your Email"
      class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
    />

    <!-- Message -->
    <textarea
      rows="5"
      placeholder="Your Message"
      class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
    ></textarea>

    <!-- Submit Button -->
    <button
      type="submit"
      class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors duration-300 w-full sm:w-auto"
    >
      Send Message
    </button>
  </form>
</section>

<app-footer></app-footer>
