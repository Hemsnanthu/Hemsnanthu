<section
  id="contact"
  class="relative min-h-screen flex flex-col justify-center items-center text-center px-6 py-16 overflow-hidden"
>
  <!-- Animated gradient background -->
  <div
    class="absolute inset-0 bg-gradient-to-r from-purple-800 via-pink-600 to-blue-600 animate-gradientMove bg-[length:400%_400%]"
  ></div>

  <!-- Subtle overlay for readability -->
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>

  <!-- Content -->
  <div class="relative z-10 w-full max-w-lg text-white">
    <h2 class="text-4xl sm:text-5xl font-bold mb-10 drop-shadow-lg">
      Contact Me
    </h2>

    <form class="space-y-5">
      <!-- Name -->
      <input
        type="text"
        placeholder="Your Name"
        class="w-full p-3 bg-black/40 border border-purple-400 rounded-lg text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent"
      />

      <!-- Email -->
      <input
        type="email"
        placeholder="Your Email"
        class="w-full p-3 bg-black/40 border border-purple-400 rounded-lg text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent"
      />

      <!-- Message -->
      <textarea
        rows="5"
        placeholder="Your Message"
        class="w-full p-3 bg-black/40 border border-purple-400 rounded-lg text-white placeholder-gray-300 resize-none focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent"
      ></textarea>

      <!-- Submit Button -->
      <button
        type="submit"
        class="relative bg-gradient-to-r from-pink-500 to-purple-600 text-white px-8 py-3 rounded-lg font-semibold transition-all duration-300 hover:shadow-[0_0_15px_#ff00ff]"
      >
        Send Message
      </button>
    </form>
  </div>
</section>

<app-footer></app-footer>

<style>
  @keyframes gradientMove {
    0% {
      background-position: 0% 50%;
    }
    50% {
      background-position: 100% 50%;
    }
    100% {
      background-position: 0% 50%;
    }
  }

  .animate-gradientMove {
    animation: gradientMove 10s ease infinite;
  }
</style>
