<nav
  class="fixed top-0 left-0 w-full z-[100] transition-transform duration-300 font-sans"
  [ngClass]="{ '-translate-y-full': isNavbarHidden }"
>
  <!-- 🔹 Glass Navbar -->
  <div class="mx-4 mt-4 px-6 py-3 flex justify-between items-center 
              rounded-2xl bg-white/[0.02] backdrop-blur-2xl 
              border border-white/10 shadow-[0_8px_32px_rgba(0,0,0,0.3)]">

    <!-- Logo -->
    <a href="portfolio"
      class="font-extrabold text-xl tracking-wide text-transparent bg-clip-text 
             bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400 hover:opacity-80 transition-opacity">
      &lt; Nantha /&gt;
    </a>

    <!-- Desktop Menu -->
    <div class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
      <!-- Added relative and group classes for a sleek underline hover effect -->
      <a href="portfolio#home" class="relative group hover:text-white transition-colors">
        Home
        <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-cyan-400 transition-all duration-300 group-hover:w-full"></span>
      </a>
      <a href="blog" class="relative group hover:text-white transition-colors">
        Blogs
        <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-purple-400 transition-all duration-300 group-hover:w-full"></span>
      </a>
      <a href="portfolio#about" class="relative group hover:text-white transition-colors">
        About
        <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-pink-400 transition-all duration-300 group-hover:w-full"></span>
      </a>
      <a href="portfolio#skills" class="relative group hover:text-white transition-colors">
        Skills
        <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-cyan-400 transition-all duration-300 group-hover:w-full"></span>
      </a>
      <a href="portfolio#projects" class="relative group hover:text-white transition-colors">
        Projects
        <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-purple-400 transition-all duration-300 group-hover:w-full"></span>
      </a>
      <a href="portfolio#contact" class="relative group hover:text-white transition-colors">
        Contact
        <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-pink-400 transition-all duration-300 group-hover:w-full"></span>
      </a>

      <!-- Resume Button -->
      <a href="assets/Nanthakumarm1_2025CV.pdf"
        download
        class="ml-4 px-5 py-2.5 rounded-full bg-white/5 border border-white/10 
               text-white text-sm font-semibold transition-all duration-300 
               hover:bg-white/10 hover:scale-105 hover:shadow-[0_0_15px_-3px_rgba(236,72,153,0.4)]">
        Resume
      </a>
    </div>

    <!-- Mobile Button -->
    <button class="md:hidden text-white hover:text-pink-400 transition-colors" (click)="toggleMobileMenu()">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          [attr.d]="isMobileMenuOpen ? 'M6 18L18 6M6 6l12 12' : 'M4 6h16M4 12h16M4 18h16'" />
      </svg>
    </button>

  </div>
</nav>

<!-- Mobile Menu -->
<div
  class="fixed inset-0 z-[90] md:hidden transition-transform duration-500 ease-in-out font-sans"
  [ngClass]="isMobileMenuOpen ? 'translate-x-0' : 'translate-x-full'"
>
  <!-- Background -->
  <div class="absolute inset-0 bg-slate-950/95 backdrop-blur-3xl"></div>

  <!-- Blobs -->
  <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-purple-600/20 blur-[100px] animate-blob pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 w-72 h-72 bg-cyan-600/20 blur-[100px] animate-blob pointer-events-none"></div>

  <!-- Mobile Close Button (Optional, but good UX) -->
  <button class="absolute top-6 right-8 text-white hover:text-pink-400 transition-colors z-50" (click)="toggleMobileMenu()">
    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <!-- Menu Links -->
  <div class="relative z-10 flex flex-col items-center justify-center h-full space-y-8 text-xl font-medium text-slate-300">
    <a href="portfolio#home" (click)="toggleMobileMenu()" class="hover:text-white hover:scale-110 transition-all duration-300">Home</a>
    <a href="blog" (click)="toggleMobileMenu()" class="hover:text-white hover:scale-110 transition-all duration-300">Blogs</a>
    <a href="portfolio#about" (click)="toggleMobileMenu()" class="hover:text-white hover:scale-110 transition-all duration-300">About</a>
    <a href="portfolio#skills" (click)="toggleMobileMenu()" class="hover:text-white hover:scale-110 transition-all duration-300">Skills</a>
    <a href="portfolio#projects" (click)="toggleMobileMenu()" class="hover:text-white hover:scale-110 transition-all duration-300">Projects</a>
    <a href="portfolio#contact" (click)="toggleMobileMenu()" class="hover:text-white hover:scale-110 transition-all duration-300">Contact</a>

    <!-- Resume Button -->
    <a href="assets/Nanthakumarm1_2025CV.pdf"
      download
      class="mt-8 px-8 py-4 rounded-full bg-white/5 border border-white/10 text-white shadow-[0_0_20px_-5px_rgba(236,72,153,0.3)] hover:bg-white/10 hover:scale-105 transition-all duration-300">
      Download Resume
    </a>
  </div>
</div>
