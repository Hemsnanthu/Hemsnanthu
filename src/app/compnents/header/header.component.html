<nav
  class="bg-gradient-to-r from-purple-700 via-pink-600 to-blue-600 text-white p-4 flex justify-between items-center fixed top-0 left-0 w-full shadow-lg z-50 transition-transform duration-300"
  [ngClass]="{ '-translate-y-full': isNavbarHidden }"
>
  <!-- Logo -->
  <div class="flex items-center gap-3 cursor-pointer">
    <a
      href="portfolio"
      class="font-bold text-xl tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-cyan-300 via-pink-400 to-purple-400"
    >
      &lt; Nantha /&gt;
    </a>
  </div>

  <!-- Desktop Links -->
  <div class="hidden md:flex space-x-6 font-medium">
    <a href="portfolio#home" class="hover:text-cyan-300 transition">Home</a>
    <a href="blog" class="hover:text-green-300 transition cursor-pointer">Blogs</a>
    <a href="portfolio#about" class="hover:text-yellow-300 transition">About</a>
    <a href="portfolio#skills" class="hover:text-pink-300 transition">Skills</a>
    <a href="portfolio#projects" class="hover:text-purple-300 transition">Projects</a>
    <a href="portfolio#contact" class="hover:text-blue-300 transition">Contact</a>
  </div>

  <!-- Mobile Hamburger -->
  <button
    class="md:hidden focus:outline-none"
    (click)="toggleMobileMenu()"
  >
    <svg
      class="w-6 h-6"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        [attr.d]="isMobileMenuOpen ? 'M6 18L18 6M6 6l12 12' : 'M4 6h16M4 12h16M4 18h16'"
      />
    </svg>
  </button>
</nav>

<!-- Mobile Menu -->
<div
  class="fixed top-0 left-0 w-full h-full bg-gradient-to-b from-purple-800 via-pink-600 to-blue-600 text-white z-40 transform transition-transform duration-300 ease-in-out md:hidden"
  [ngClass]="isMobileMenuOpen ? 'translate-x-0' : 'translate-x-full'"
>
  <div class="flex flex-col h-full px-6 py-20 space-y-6 text-lg font-medium">
    <a href="portfolio#home" (click)="toggleMobileMenu()" class="hover:text-cyan-300 transition">Home</a>
    <a href="blog" (click)="toggleMobileMenu()" class="hover:text-green-300 transition cursor-pointer">Blogs</a>
    <a href="portfolio#about" (click)="toggleMobileMenu()" class="hover:text-yellow-300 transition">About</a>
    <a href="portfolio#skills" (click)="toggleMobileMenu()" class="hover:text-pink-300 transition">Skills</a>
    <a href="portfolio#projects" (click)="toggleMobileMenu()" class="hover:text-purple-300 transition">Projects</a>
    <a href="portfolio#contact" (click)="toggleMobileMenu()" class="hover:text-blue-300 transition">Contact</a>

    <button
      class="mt-8 font-semibold px-4 py-3 rounded-md bg-white/20 hover:bg-white/30 text-white transition-all duration-300 border border-white/30 backdrop-blur-md"
    >
      Resume
    </button>
  </div>
</div>
