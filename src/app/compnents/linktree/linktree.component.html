<div class="relative min-h-screen flex items-center justify-center py-12 px-6 overflow-hidden bg-slate-950 font-sans">
  <!-- 🔹 Animated Glowing Blobs Background -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-purple-600/20 rounded-full mix-blend-screen filter blur-[120px] animate-blob"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-cyan-600/20 rounded-full mix-blend-screen filter blur-[120px] animate-blob animation-delay-2000"></div>
  
  <!-- 🔹 Glassmorphism Profile Card -->
  <div class="relative z-10 flex flex-col items-center w-full max-w-md p-8 sm:p-10 bg-white/[0.02] backdrop-blur-2xl border border-white/10 rounded-[2.5rem] shadow-[0_8px_32px_0_rgba(0,0,0,0.3)]">
    
    <!-- Profile Image with Glowing Frame -->
    <div class="relative group mb-6">
      <div class="absolute inset-0 bg-gradient-to-tr from-cyan-500 to-pink-500 rounded-full blur-md opacity-60 group-hover:opacity-100 transition-opacity duration-500 animate-pulse"></div>
      <img
        src="assets/logo.png"
        alt="Profile"
        class="relative w-28 h-28 rounded-full object-cover border-[4px] border-slate-900 shadow-xl transition-transform duration-500 group-hover:scale-105"
      />
    </div>
    <!-- Name -->
    <h1 class="text-3xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400 mb-8 text-center">
      {{ profile.name }}
    </h1>
    <!-- Links List -->
    <div class="flex flex-col gap-4 w-full">
      <!-- Using Angular 17+ @for syntax -->
      @for (link of profile.links; track $index) {
        <a
          [href]="link.url"
          target="_blank"
          class="group relative flex items-center justify-center gap-3 w-full py-4 px-6 bg-white/5 border border-white/10 rounded-2xl text-slate-300 font-medium transition-all duration-300 hover:scale-[1.02] hover:-translate-y-1 hover:bg-white/10 hover:text-white hover:border-purple-500/50 hover:shadow-[0_0_20px_-5px_rgba(168,85,247,0.4)] overflow-hidden"
        >
          <!-- Hover Background Gradient Effect -->
          <div class="absolute inset-0 bg-gradient-to-r from-cyan-500/10 via-purple-500/10 to-pink-500/10 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
          
          <span class="relative z-10 flex items-center gap-3">
            <i [class]="link.icon + ' text-xl group-hover:text-pink-400 transition-colors'"></i>
            <span class="tracking-wide">{{ link.label }}</span>
          </span>
        </a>
      }
    </div>
  </div>
</div>
<!-- Ensure you have these CSS animations in your global stylesheet -->
<style>
  @keyframes blob {
    0% { transform: translate(0px, 0px) scale(1); }
    33% { transform: translate(30px, -50px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(0.9); }
    100% { transform: translate(0px, 0px) scale(1); }
  }
  .animate-blob {
    animation: blob 7s infinite;
  }
  .animation-delay-2000 {
    animation-delay: 2s;
  }
</style>
